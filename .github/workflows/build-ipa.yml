name: Build UnSigned IPA
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 列出 Xcode 版本
        run: xcodebuild -version
      - name: 编译 iOS 未签名 .app
        run: |
          xcodebuild -project PhotoCleaner.xcodeproj \
            -target "PhotoCleaner iOS" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CONFIGURATION_BUILD_DIR=./build \
            build
      - name: 打包成未签名 .ipa
        run: |
          ls -la ./build/
          APP_PATH=$(find ./build -name "*.app" -type d | head -1)
          echo "APP=$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y PhotoCleaner-unsigned.ipa Payload
          unzip -l PhotoCleaner-unsigned.ipa
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCleaner-unsigned-ipa
          path: PhotoCleaner-unsigned.ipa
          if-no-files-found: error
